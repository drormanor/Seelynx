name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, don't use this form. See SECURITY.md.
        Leave out passwords, camera addresses and anything else private from your network.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Seelynx version
      description: Shown next to Help in the app.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - Windows service
        - Windows, started by hand
        - Docker on Linux
        - Other
    validations:
      required: true
  - type: input
    id: cameras
    attributes:
      label: Cameras involved
      description: Make, model and firmware, if the problem is with particular cameras.
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Such as Chrome 141 on Windows 11.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From seelynx.log in the data folder. Check them for anything private first.
      render: text
