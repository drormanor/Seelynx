name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The server embeds the built client, so build it first.
      - name: Build the web client
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

  docker:
    name: Formatting and Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Here rather than on Windows, where checkouts get CRLF line endings that gofmt rejects.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Build the image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t seelynx:ci .
